name: wellness-ledger
version: 0.2.21
description: |
  Wellness member payment ledger: the wellnessaccount vertex type (WellnessCreateAccount,
  independently-minted id, one per member identity via a .wellnessLedgerAccount
  guard aspect on the identity) + the wellnesstransaction vertex type
  (WellnessDebitAccount/WellnessCreditAccount, append-only entries linked to the account via
  postedTo, WellnessDebitAccount independently taking optional bookingRef (no-show
  settlement, writes settles) and priceBookingRef (class-price settlement,
  writes settlesClassPrice) back-refs; WellnessCreditAccount independently
  taking optional refundRef (writes settlesRefund) and optional reason
  (payment|waiver, default payment) + the wellnessLedgerHistory
  read-model lens (one row per transaction) + the wellnessMemberAccounts lens
  (member identity -> account key lookup) + the wellnessNoShowSettlement
  Weaver playbook (lazily opens the member's account via WellnessCreateAccount,
  then auto-charges the no-show fee) + the wellnessClassPriceSettlement Weaver
  playbook (same lazy account-open relay, then auto-charges the class price,
  unconditional on attendance) + the wellnessRefundSettlement Weaver playbook
  (reverses a class-price charge already posted before its booking was
  cancelled, anchored on wellness-domain's wellnessrefund marker vertex).
  WellnessCreditAccount ALSO grants a member scope=self (pay down their own
  balance, never waive it — reason:"waiver" is rejected server-side for a
  self-scoped submit), ownership + amount proven server-side against the
  account's own heldFor->identity topology and postedTo history.
  Depends wellness-domain.
depends:
  - wellness-domain
declares:
  ddls:
    - canonicalName: wellnessaccount
      class: meta.ddl.vertexType
    - canonicalName: wellnessLedgerAccountGuard
      class: meta.ddl.aspectType
    - canonicalName: wellnesstransaction
      class: meta.ddl.vertexType
  lenses:
    - canonicalName: wellnessLedgerHistory
      adapter: nats-kv
      bucket: wellness-ledger-history
      engine: full
    - canonicalName: wellnessMemberAccounts
      adapter: nats-kv
      bucket: wellness-member-accounts
      engine: full
    - canonicalName: wellnessNoShowSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: wellnessClassPriceSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: wellnessRefundSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  opMetas:
    - operationType: WellnessCreateAccount
    - operationType: WellnessDebitAccount
    - operationType: WellnessCreditAccount
  permissions:
    - operationType: WellnessCreateAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: WellnessCreateAccount
      scope: self
      grantsTo: [consumer]
    - operationType: WellnessDebitAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: WellnessCreditAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: WellnessCreditAccount
      scope: self
      grantsTo: [consumer]
  weaverTargets:
    - targetId: wellnessNoShowSettlement
      lensRef: wellnessNoShowSettlement
    - targetId: wellnessClassPriceSettlement
      lensRef: wellnessClassPriceSettlement
    - targetId: wellnessRefundSettlement
      lensRef: wellnessRefundSettlement
