name: loftspace-ledger
version: 0.5.1
description: |
  Loftspace tenant payment ledger: the account vertex type (LoftspaceCreateAccount,
  independently-minted id, one per lease via a .ledgerAccount guard aspect on
  the leaseapp) + the transaction vertex type (DebitAccount / CreditAccount,
  append-only entries linked to the account via postedTo; DebitAccount's
  optional clauseRef writes the authorizedBy audit link + updates the clause
  status (completed one-time, or re-armed if monthly, Fire V3); CreditAccount
  also grants a consumer scope=self -- a resident paying down their own
  balance) + the ledgerHistory read-model lens (one row per transaction) +
  the leaseAccounts lens (lease -> account key lookup). Depends lease-signing.
depends:
  - lease-signing
declares:
  ddls:
    - canonicalName: account
      class: meta.ddl.vertexType
    - canonicalName: ledgerAccountGuard
      class: meta.ddl.aspectType
    - canonicalName: transaction
      class: meta.ddl.vertexType
  lenses:
    - canonicalName: ledgerHistory
      adapter: nats-kv
      bucket: loftspace-ledger-history
      engine: full
    - canonicalName: leaseAccounts
      adapter: nats-kv
      bucket: loftspace-lease-accounts
      engine: full
  opMetas:
    - operationType: LoftspaceCreateAccount
    - operationType: CreditAccount
    - operationType: DebitAccount
  permissions:
    - operationType: LoftspaceCreateAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: DebitAccount
      scope: any
      grantsTo: [operator]
    - operationType: CreditAccount
      scope: any
      grantsTo: [operator]
    - operationType: CreditAccount
      scope: self
      grantsTo: [consumer]
