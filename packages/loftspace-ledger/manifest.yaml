name: loftspace-ledger
version: 0.10.0
description: |
  Loftspace tenant payment ledger: the account vertex type (LoftspaceCreateAccount,
  independently-minted id, one per lease via a .ledgerAccount guard aspect on
  the leaseapp) + the transaction vertex type (DebitAccount / CreditAccount,
  append-only entries linked to the account via postedTo; DebitAccount's
  optional clauseRef writes the authorizedBy audit link + updates the clause
  status (completed one-time, or re-armed if monthly, Fire V3);
  ReturnDeposit credits the NET of a charged purpose=deposit clause less any
  recorded deduction once the lease's tenancy has ended and marks it
  returned, Weaver's leaseRentSettlement dispatch; RecordDepositDeduction
  takes a landlord's deduction off a charged, still-held deposit clause (a
  third entry type, neither debit nor credit); PayOutBalance pays an ended
  tenancy's whole credit balance out, computed from the account's own
  history;
  LoftspaceRecordCharge is a person's manual charge, never clause-authorized;
  it, CreditAccount, RecordDepositDeduction and PayOutBalance grant a
  consumer scope=self proven off the account's
  own heldFor topology -- a resident paying down their own balance (credit
  only, capped) or a landlord recording a charge, payment, deduction or
  payout on a lease of a
  unit they manage) + the ledgerHistory read-model lens (one row per
  transaction, incl. kind) + the leaseAccounts lens (lease -> account key lookup, plus the
  account's arrears due date and reminder timestamps).
  Also ships the rent-arrears reminder: the account's .arrears episode aspect
  (minted by evaluation; every posted entry marks it stale, since no balance
  is stored) + the loftspaceArrearsReminders weaver-target convergence lens,
  whose playbook dispatches EvaluateLoftspaceArrears -- that op ages the
  account with the same plain FIFO the tenant's statement runs, records the
  head's own recorded due date (its postedAt when it recorded none) and the
  reminder instant five days after it, and fires ONE external.notification
  per arrears episode to the bridge's "notification" adapter, keyed on
  (accountKey, dueAt, headKey). RecordLoftspaceArrearsReminderNotification records the
  outcome. Depends lease-signing + orchestration-base.
depends:
  - lease-signing
  - orchestration-base
declares:
  ddls:
    - canonicalName: account
      class: meta.ddl.vertexType
    - canonicalName: ledgerAccountGuard
      class: meta.ddl.aspectType
    - canonicalName: loftspaceAccountArrears
      class: meta.ddl.aspectType
    - canonicalName: transaction
      class: meta.ddl.vertexType
    - canonicalName: depositDeductions
      class: meta.ddl.aspectType
    - canonicalName: loftspaceArrearsNotificationOp
      class: meta.ddl.vertexType
    - canonicalName: loftspaceAccountArrearsNotification
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: ledgerHistory
      adapter: nats-kv
      bucket: loftspace-ledger-history
      engine: full
    - canonicalName: leaseAccounts
      adapter: nats-kv
      bucket: loftspace-lease-accounts
      engine: full
    - canonicalName: loftspaceArrearsReminders
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  opMetas:
    - operationType: LoftspaceCreateAccount
    - operationType: CreditAccount
    - operationType: LoftspaceRecordCharge
    - operationType: ReturnDeposit
    - operationType: RecordDepositDeduction
    - operationType: PayOutBalance
    - operationType: EvaluateLoftspaceArrears
    - operationType: RecordLoftspaceArrearsReminderNotification
  permissions:
    - operationType: LoftspaceCreateAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: LoftspaceCreateAccount
      scope: self
      grantsTo: [consumer]
    - operationType: DebitAccount
      scope: any
      grantsTo: [operator]
    - operationType: CreditAccount
      scope: any
      grantsTo: [operator]
    - operationType: CreditAccount
      scope: self
      grantsTo: [consumer]
    - operationType: LoftspaceRecordCharge
      scope: any
      grantsTo: [operator]
    - operationType: LoftspaceRecordCharge
      scope: self
      grantsTo: [consumer]
    - operationType: ReturnDeposit
      scope: any
      grantsTo: [operator]
    - operationType: RecordDepositDeduction
      scope: any
      grantsTo: [operator]
    - operationType: RecordDepositDeduction
      scope: self
      grantsTo: [consumer]
    - operationType: PayOutBalance
      scope: any
      grantsTo: [operator]
    - operationType: PayOutBalance
      scope: self
      grantsTo: [consumer]
    - operationType: EvaluateLoftspaceArrears
      scope: any
      grantsTo: [operator]
    - operationType: RecordLoftspaceArrearsReminderNotification
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: loftspaceArrearsReminders
      lensRef: loftspaceArrearsReminders
