name: clinic-reminders
version: 0.10.6
description: |
  Clinic appointment & follow-up reminders + recurring visit series + the auto
  no-show closer — the clinic vertical's orchestration. Four one-shot/rolling @at
  convergences over clinic-domain's appointment: (1) the ~24h-ahead appointment
  reminder — the .reminder aspect + RecordAppointmentReminder op, the
  appointmentReminders weaver-target lens (freshUntil = the .schedule.remindAt
  clinic-domain precomputes); (2) the at-the-date follow-up reminder — the
  .followUpReminder aspect + RecordFollowUpReminder op, the followUpReminders
  weaver-target lens (freshUntil = the .documentation.followUpDate a documented visit
  requested); (3) a rolling recurring visit series over its own visitseries vertex
  type — StartVisitSeries / PauseVisitSeries / ResumeVisitSeries / EndVisitSeries /
  AdvanceVisitSeries ops, the visitSeriesDue weaver-target lens (freshUntil =
  .progress.nextDueAt, re-armed forward on every advance instead of clearing to a
  permanent close); and (4) pastDueAppointments — closes a past-due, still-open
  appointment (a visit whose .schedule.endsAt passed with no staff status update)
  by dispatching clinic-domain's MarkPastDueNoShow once endsAt passes, binding
  freshUntil DIRECTLY to endsAt (the unroutedTasks idiom, orchestration-base)
  rather than a derived lead-offset deadline. Each gap dispatches a directOp via
  the §10.8 playbook; all four invert lease-signing's freshness re-open
  (open-at-deadline instead of reopen-at-expiry). Both reminder ops also fire
  external.notification off their own outbox to the bridge's "notification" adapter;
  RecordAppointmentReminderNotification / RecordFollowUpReminderNotification record
  the outcome as an audit-only aspect (neither gates the convergence lenses above).
  Depends on clinic-domain (the appointment/patient/provider vertex types +
  .schedule.remindAt / .schedule.endsAt / .documentation.followUpDate / the
  MarkPastDueNoShow op) and orchestration-base (MarkExpired re-touch at the @at
  firing).
depends:
  - clinic-domain
  - orchestration-base
declares:
  ddls:
    - canonicalName: appointmentReminderOp
      class: meta.ddl.vertexType
    - canonicalName: appointmentReminder
      class: meta.ddl.aspectType
    - canonicalName: followUpReminderOp
      class: meta.ddl.vertexType
    - canonicalName: followUpReminder
      class: meta.ddl.aspectType
    - canonicalName: appointmentReminderNotificationOp
      class: meta.ddl.vertexType
    - canonicalName: appointmentReminderNotification
      class: meta.ddl.aspectType
    - canonicalName: followUpReminderNotificationOp
      class: meta.ddl.vertexType
    - canonicalName: followUpReminderNotification
      class: meta.ddl.aspectType
    - canonicalName: visitseries
      class: meta.ddl.vertexType
    - canonicalName: visitSeriesDefinition
      class: meta.ddl.aspectType
    - canonicalName: visitSeriesProgress
      class: meta.ddl.aspectType
    - canonicalName: visitSeriesPaused
      class: meta.ddl.aspectType
    - canonicalName: visitSeriesGuard
      class: meta.ddl.aspectType
    - canonicalName: visitSeriesSiteAssignment
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: appointmentReminders
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: followUpReminders
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: visitSeriesDue
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: visitSeriesSiteBackfill
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: visitSeriesRead
      adapter: postgres
      engine: full
    - canonicalName: pastDueAppointments
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  permissions:
    - operationType: RecordAppointmentReminder
      scope: any
      grantsTo: [operator]
    - operationType: RecordFollowUpReminder
      scope: any
      grantsTo: [operator]
    - operationType: RecordAppointmentReminderNotification
      scope: any
      grantsTo: [operator]
    - operationType: RecordFollowUpReminderNotification
      scope: any
      grantsTo: [operator]
    - operationType: StartVisitSeries
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: PauseVisitSeries
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: ResumeVisitSeries
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: EndVisitSeries
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: SetVisitSeriesSite
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: AdvanceVisitSeries
      scope: any
      grantsTo: [operator]
    - operationType: BackfillVisitSeriesSite
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: appointmentReminders
      lensRef: appointmentReminders
    - targetId: followUpReminders
      lensRef: followUpReminders
    - targetId: visitSeriesDue
      lensRef: visitSeriesDue
    - targetId: visitSeriesSiteBackfill
      lensRef: visitSeriesSiteBackfill
    - targetId: pastDueAppointments
      lensRef: pastDueAppointments
  opMetas:
    - operationType: RecordAppointmentReminder
    - operationType: RecordFollowUpReminder
    - operationType: RecordAppointmentReminderNotification
    - operationType: RecordFollowUpReminderNotification
    - operationType: StartVisitSeries
    - operationType: PauseVisitSeries
    - operationType: ResumeVisitSeries
    - operationType: EndVisitSeries
    - operationType: SetVisitSeriesSite
    - operationType: AdvanceVisitSeries
    - operationType: BackfillVisitSeriesSite
