name: cafe-domain
version: 0.8.3
description: |
  Café house-tab POS session domain: the tab vertex type (OpenTab/Charge/
  VoidCharge/Settle, OCC-conditioned running total) + the tabStatus aspect
  type + the cafeTabSettlement actorAggregate convergence lens
  (missing_account/missing_charge) + the §10.8 playbook dispatching
  directOp(CreateAccount)/directOp(DebitAccount) (cafe-ledger) to post a
  settled tab onto the resident's house-tab account + edge-manifest
  descriptor metadata (OpenTab/Settle, Fire 5 Inc 4) + the menuItem
  self-order catalog (CreateMenuItem/RetireMenuItem, the menuCatalog lens)
  a self-service Charge binds against, deriving amountCents from a catalog
  entry rather than trusting a caller-supplied number. VoidCharge corrects
  a mis-tapped charge (operator/frontOfHouse only). The cafeLeaseWorkplaces
  lens carries each lease's covering locations — the read-side half of the
  workplace confinement this package's own require_workplace enforces on
  writes, so a staff read is scoped to the building they work at. Depends
  lease-signing + cafe-ledger.
depends:
  - lease-signing
  - cafe-ledger
declares:
  ddls:
    - canonicalName: tab
      class: meta.ddl.vertexType
    - canonicalName: tabStatus
      class: meta.ddl.aspectType
    - canonicalName: cafeOpenTabGuard
      class: meta.ddl.aspectType
    - canonicalName: menuitem
      class: meta.ddl.vertexType
    - canonicalName: menuItemPrice
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: cafeTabSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: menuCatalog
      adapter: nats-kv
      bucket: cafe-menu-catalog
      engine: full
    - canonicalName: cafeLeaseWorkplaces
      adapter: nats-kv
      bucket: cafe-lease-workplaces
      engine: full
  permissions:
    - operationType: OpenTab
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: OpenTab
      scope: self
      grantsTo: [consumer]
    - operationType: Charge
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Charge
      scope: self
      grantsTo: [consumer]
    - operationType: VoidCharge
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Settle
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Settle
      scope: self
      grantsTo: [consumer]
    - operationType: CreateMenuItem
      scope: any
      grantsTo: [operator]
    - operationType: RetireMenuItem
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: cafeTabSettlement
      lensRef: cafeTabSettlement
  opMetas:
    - operationType: OpenTab
    - operationType: Charge
    - operationType: VoidCharge
    - operationType: Settle
