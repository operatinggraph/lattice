name: cafe-domain
version: 0.17.0
description: |
  Café house-tab POS session domain: the tab vertex type (OpenTab/Charge/
  VoidCharge/MarkLineServed/Settle/SettleStaleTab/BackfillTabStaleAt, OCC-conditioned
  running total) + the
  tabStatus aspect type + the cafeTabSettlement actorAggregate convergence
  lens (missing_account/missing_charge/missing_payment) + the §10.8 playbook
  dispatching directOp(CreateAccount)/directOp(DebitAccount)/
  directOp(CreditCafeAccount) (cafe-ledger) to post a settled tab onto the
  resident's house-tab account, and after the charge the cash a staff
  Settle{paidCents} recorded as taken at the counter + the
  cafeStaleTabSettlement actorAggregate convergence lens (missing_settle,
  auto-closes an OPEN tab once its own staleAt deadline passes unattended,
  orchestration-internal directOp(SettleStaleTab); missing_staleat,
  backfills staleAt on a tab opened before that field shipped, orchestration-
  internal directOp(BackfillTabStaleAt)) + edge-manifest
  descriptor metadata (OpenTab/Settle, Fire 5 Inc 4) + the menuItem
  catalog (CreateMenuItem/RetireMenuItem/SetMenuItemAvailability/
  SetMenuItemLocation/UpdateMenuItem,
  the menuCatalog lens — flagging missingLocation for an item whose place is
  gone; UpdateMenuItem rewrites the item's .price aspect — name and/or price
  — in one OCC'd upsert, the only way to correct either after minting;
  SetMenuItemAvailability rewrites the same aspect's available flag, the
  desk's sold-out-for-the-day toggle) a
  Charge —
  self-service OR staff POS alike — can bind against by naming menuItemKey,
  deriving amountCents from a catalog entry rather than trusting a
  caller-supplied number and rejecting ItemUnavailable if the item is
  currently marked off the menu; a staff Charge with no menuItemKey still
  hand-keys amountCents for an off-menu charge the catalog does not cover.
  Each item carries a servedAt link to the place that serves it, which is
  what lets a browse lens offer it to a resident who lives there, and
  which ANY catalog-bound Charge is confined to (the item's servedAt place
  must cover the tab's own lease-unit, or an ancestor of it, or the charge
  is denied); the menuCatalog lens projects that same servedAt key per
  item, so a picker can offer only what the confined Charge would accept.
  VoidCharge{tabKey, lineId} corrects a mis-tapped charge (operator/frontOfHouse only) by
  voiding one specific .status.lines entry by its id, deriving the amount from the line
  itself rather than trusting a caller-supplied amountCents. Every Charge appends a
  structured {id, description, amountCents, voided, orderedBy, orderedAt} entry to
  .status.lines, the itemized breakdown a receipt renders instead of a flat string; a staff
  ring-up's entry is served at ring-up (servedAt/servedBy), a self-order's is unserved until
  the desk submits MarkLineServed{tabKey, lineId} (operator/frontOfHouse only, confined like
  VoidCharge), so the lines with orderedAt and no servedAt are the desk's orders queue.
  .status.itemsMemo is re-derived from the live (non-voided) lines on every
  Charge/VoidCharge, a comma-joined running summary.
  cafeTabSettlement projects both columns so a tab shows what was rung up, and the
  Weaver-dispatched DebitAccount posts the itemsMemo string as the settled ledger entry's memo.
  The cafeLeaseWorkplaces
  lens carries each lease's covering locations — the read-side half of the
  workplace confinement this package's own require_workplace enforces on
  writes, so a staff read is scoped to the building they work at.
  cafeIdentitiesRead is a PROTECTED Postgres SECURE LENS (Contract #3 §3.10)
  resolving a signed-in identity's own name — cmd/cafe-app reads it to render
  "Signed in as <name>" instead of a raw NanoID, mirroring loftspace-domain's
  applicantRosterRead. Each row anchors on its own identity NanoID PLUS every
  workplace building that covers the identity's own lease, so a
  worksAt-anchored front-desk actor (service-location's cap-read.staff grant)
  can also resolve the name of any resident whose lease their workplace
  covers, not only themselves. Depends lease-signing + cafe-ledger.
depends:
  - lease-signing
  - cafe-ledger
declares:
  ddls:
    - canonicalName: tab
      class: meta.ddl.vertexType
    - canonicalName: tabStatus
      class: meta.ddl.aspectType
    - canonicalName: cafeOpenTabGuard
      class: meta.ddl.aspectType
    - canonicalName: menuitem
      class: meta.ddl.vertexType
    - canonicalName: menuItemPrice
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: cafeTabSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: cafeStaleTabSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: menuCatalog
      adapter: nats-kv
      bucket: cafe-menu-catalog
      engine: full
    - canonicalName: cafeLeaseWorkplaces
      adapter: nats-kv
      bucket: cafe-lease-workplaces
      engine: full
    - canonicalName: cafeIdentitiesRead
      adapter: postgres
      engine: full
  permissions:
    - operationType: OpenTab
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: OpenTab
      scope: self
      grantsTo: [consumer]
    - operationType: Charge
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Charge
      scope: self
      grantsTo: [consumer]
    - operationType: VoidCharge
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: MarkLineServed
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Settle
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: Settle
      scope: self
      grantsTo: [consumer]
    - operationType: SettleStaleTab
      scope: any
      grantsTo: [operator]
    - operationType: BackfillTabStaleAt
      scope: any
      grantsTo: [operator]
    - operationType: CreateMenuItem
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: RetireMenuItem
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: SetMenuItemAvailability
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: SetMenuItemLocation
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: UpdateMenuItem
      scope: any
      grantsTo: [operator, frontOfHouse]
  weaverTargets:
    - targetId: cafeTabSettlement
      lensRef: cafeTabSettlement
    - targetId: cafeStaleTabSettlement
      lensRef: cafeStaleTabSettlement
  opMetas:
    - operationType: OpenTab
    - operationType: Charge
    - operationType: VoidCharge
    - operationType: MarkLineServed
    - operationType: Settle
    - operationType: CreateMenuItem
    - operationType: RetireMenuItem
    - operationType: SetMenuItemAvailability
    - operationType: SetMenuItemLocation
    - operationType: UpdateMenuItem
