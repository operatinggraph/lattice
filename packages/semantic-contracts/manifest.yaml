name: semantic-contracts
version: 0.7.2
description: |
  LoftSpace "Executable Paper" reference package (fixed/one-time,
  conditioned, judgment, recurring monthly — termed to a calendar-month
  period grid or untermed — and prorated computational clauses, plus
  self-amendment and early shortening): the clause vertex type
  (CreateClause/SupersedeClause/BackfillClauseTerm/ShortenClauseTerm,
  .prose/.terms/.status/.clauseInspection aspects,
  governs + chargesTo/requiresInspectionBy/conditionedOn/amends links) + the
  clauseSatisfaction actorAggregate convergence lens (§10.2, missing_charge/
  missing_inspection, freshUntil-armed recurring freshness on the term's
  period grid) + the §10.8 playbook dispatching directOp(DebitAccount)/
  assignTask(InspectPremises) on the gaps + the leaseRentSettlement
  actorAggregate lens/playbook bootstrapping an approved signed lease's
  ledger account then a recurring monthly rent clause for its current term,
  terming any monthly clause it has minted without one, and shortening a
  termed clause to a recorded early move-out (missing_account
  → directOp(LoftspaceCreateAccount), missing_clause → directOp(CreateClause)
  with the term, missing_term → directOp(BackfillClauseTerm),
  missing_termShortened → directOp(ShortenClauseTerm), missing_deposit →
  directOp(CreateClause) with purpose=deposit, missing_depositReturn →
  directOp(ReturnDeposit), dollars→cents conversion in the lens). Depends
  lease-signing + loftspace-ledger.
depends:
  - lease-signing
  - loftspace-ledger
declares:
  ddls:
    - canonicalName: clause
      class: meta.ddl.vertexType
    - canonicalName: clauseProse
      class: meta.ddl.aspectType
    - canonicalName: clauseTerms
      class: meta.ddl.aspectType
    - canonicalName: clauseStatus
      class: meta.ddl.aspectType
    - canonicalName: clauseInspection
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: clauseSatisfaction
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: leaseRentSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  permissions:
    - operationType: CreateClause
      scope: any
      grantsTo: [operator]
    - operationType: InspectPremises
      scope: any
      grantsTo: [operator]
    - operationType: SupersedeClause
      scope: any
      grantsTo: [operator]
    - operationType: BackfillClauseTerm
      scope: any
      grantsTo: [operator]
    - operationType: ShortenClauseTerm
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: clauseSatisfaction
      lensRef: clauseSatisfaction
    - targetId: leaseRentSettlement
      lensRef: leaseRentSettlement
  opMetas:
    - operationType: CreateClause
    - operationType: InspectPremises
    - operationType: SupersedeClause
    - operationType: BackfillClauseTerm
    - operationType: ShortenClauseTerm
