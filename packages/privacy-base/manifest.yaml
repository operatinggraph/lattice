name: privacy-base
version: 0.15.8
description: |
  The key-custody envelope (piiKey) backing crypto-shred
  (vault-crypto-shredding-design.md §2.1/§2.2), for both holder kinds.
  ShredIdentityKey marks a person's envelope shredded=true and emits
  privacy.keyShredded; ShredRetentionClassKey does the same for a retention
  class's envelope and emits privacy.retentionClassKeyShredded
  (retention-class-key-custody-design.md §4.3). Both are consumed by the
  privacy-worker's async Vault.ShredKey destruction, on their own durables. The
  two verbs are the erasure boundary itself: a record custodied on a class
  survives its subject's erasure and dies on the class's own expiry. SealIdentityForErasure
  writes the erasureRequested marker that closes an erased person's write path
  (erasure-orchestration-design.md §6), which is what makes a residue count
  provable rather than point-in-time. SealIdentityForErasureComplete then walks
  that person's remaining links inside its own commit and writes the erasure
  attestation only if none is live (§7.2) — the lens decides when to try, the op
  decides whether it is true. The identityErasureComplete Weaver target
  (§7.2/§10.8) is what turns the identityErasureResidue lens's five projected
  missing_* columns into that convergence loop: directOp dispatch of the two
  sweep ops and the seal, surface for the two async crypto-shred halves. The
  identityErasure Loom pattern (§5) is the ordered spine in front of that tail —
  four systemOp steps that shred, seal, unbind and purge, each declaring its own
  read-set. Its step 1 binds ShredIdentityKey, whose grant ships from
  privacy-operator-grant rather than here. No other dependencies — the DDLs
  attach to identity vertices by Contract #1 key-shape convention, not an
  install-order coupling with identity-domain.
declares:
  ddls:
    - canonicalName: piiKey
      class: meta.ddl.aspectType
    - canonicalName: shredIdentityKey
      class: meta.ddl.vertexType
    - canonicalName: privacy.keyShredded
      class: meta.ddl.eventType
    - canonicalName: shredRetentionClassKey
      class: meta.ddl.vertexType
    - canonicalName: privacy.retentionClassKeyShredded
      class: meta.ddl.eventType
    - canonicalName: erasureRequested
      class: meta.ddl.aspectType
    - canonicalName: sealIdentityForErasure
      class: meta.ddl.vertexType
    - canonicalName: privacy.erasureRequested
      class: meta.ddl.eventType
    - canonicalName: purgeIdentityDedupFootprint
      class: meta.ddl.vertexType
    - canonicalName: privacy.dedupFootprintSwept
      class: meta.ddl.eventType
    - canonicalName: erasure
      class: meta.ddl.aspectType
    - canonicalName: sealIdentityForErasureComplete
      class: meta.ddl.vertexType
    - canonicalName: privacy.erasureCompleted
      class: meta.ddl.eventType
  lenses:
    - canonicalName: shredStatus
      adapter: nats-kv
      bucket: privacy-shreds
      engine: full
    - canonicalName: retentionKeyStatus
      adapter: nats-kv
      bucket: privacy-retention-keys
      engine: full
    - canonicalName: piiKeyEnvelope
      adapter: nats-kv
      bucket: privacy-pii-key-envelopes
      engine: full
    - canonicalName: identityErasureResidue
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  weaverTargets:
    - targetId: identityErasureComplete
      lensRef: identityErasureResidue
  loomPatterns:
    - patternId: identityErasure
      subjectType: identity
  permissions:
    - operationType: RecordShredFinalization
      scope: any
      grantsTo: [operator]
    - operationType: RecordRetentionClassShredFinalization
      scope: any
      grantsTo: [operator]
    - operationType: SealIdentityForErasure
      scope: any
      grantsTo: [operator]
    - operationType: PurgeIdentityDedupFootprint
      scope: any
      grantsTo: [operator]
    - operationType: SealIdentityForErasureComplete
      scope: any
      grantsTo: [operator]
