name: edge-manifest
version: 0.15.10
description: |
  The Facet edge app's world manifest: fifteen Personal Lenses (edgeIdentity/
  edgeServices/edgeCatalog/edgeTasks/
  edgeInstances/edgeEntitySessions/edgeEntityProviders/edgeEntityBookings/
  edgeEntityTabs/edgeEntityStudios/edgeEntityMenuItems/edgeStaffPanes/
  edgeStaffWorkOrders/edgeProviderSchedule/edgeProviderQueue —
  edgeEntitySessions, edgeCatalog and edgeTasks each carry a second Walk for
  their role-derived reachability path, folding the former
  edgeInstructorSessions, edgeCatalogRoles and edgeTasksQueued siblings in)
  projecting identity (incl. the
  provider/instructor/serviceprovider self-anchors for {me.<type>} dispatch,
  and the same bindings
  relation-stamped and named in anchors so the renderer can group a person's
  hats by provenance — persona-worlds-design.md Fires W0/W5), reachable
  services, the op descriptor vocabulary, open and queued tasks, the
  maintenance work orders at a staff actor's workplace, service instances,
  and browsable dispatch-target entities (wellness sessions via studio
  locatedAt, clinic providers via practicesAt, the actor's own bookings via
  bookedBy, the actor's own open cafe tabs via their lease, the wellness
  studios at a staff actor's workplace, a bound provider's own appointments,
  a bound serviceprovider's own instance queue, a bound instructor's own led
  sessions — manifest.ent rows a declared dispatch.targetType resolves
  against) into the manifest.* namespace over the per-actor SYNC transport.
  Each non-self-anchored lens declares its actor->anchor reachability once, as
  an AnchorWalk, and pkgmgr compiles both the lens's own cypher and the
  read-grant producer that grants its anchors. That yields three generated
  producer lenses — edgeManifestReadGrants, edgeManifestStaffReadGrants,
  edgeManifestProviderReadGrants — one per declared ReadGrantDomain, writing
  cap-read.edgeManifest*.<actor>: without them every non-self-anchored manifest
  row is dropped by Refractor's D1 readableAnchors fail-closed gate, which is
  never derived from the manifest lenses' own reachability. They are
  actorAggregate nats-kv lenses (Contract #6 §6.14 Path B, the same shape
  internal/bootstrap/lenses.go's CapabilityReadLensDefinition uses at the kernel
  level) — not a Postgres GrantTable (that's Path A / RLS for Protected reads,
  irrelevant here).
depends:
  - identity-domain
  - orchestration-base
  - service-domain
  - service-location
declares:
  lenses:
    - canonicalName: edgeIdentity
      adapter: nats-subject
      engine: full
    - canonicalName: edgeServices
      adapter: nats-subject
      engine: full
    - canonicalName: edgeCatalog
      adapter: nats-subject
      engine: full
    - canonicalName: edgeTasks
      adapter: nats-subject
      engine: full
    - canonicalName: edgeInstances
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntitySessions
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntityProviders
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntityBookings
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntityTabs
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntityStudios
      adapter: nats-subject
      engine: full
    - canonicalName: edgeEntityMenuItems
      adapter: nats-subject
      engine: full
    - canonicalName: edgeStaffPanes
      adapter: nats-subject
      engine: full
    - canonicalName: edgeStaffWorkOrders
      adapter: nats-subject
      engine: full
    - canonicalName: edgeProviderSchedule
      adapter: nats-subject
      engine: full
    - canonicalName: edgeProviderQueue
      adapter: nats-subject
      engine: full
    - canonicalName: edgeManifestStaffReadGrants
      adapter: nats-kv
      engine: full
    - canonicalName: edgeManifestReadGrants
      adapter: nats-kv
      engine: full
    - canonicalName: edgeManifestProviderReadGrants
      adapter: nats-kv
      engine: full
  panes:
    - paneId: staffWorklist
    - paneId: signInMethods
