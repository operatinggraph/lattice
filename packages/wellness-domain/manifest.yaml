name: wellness-domain
version: 0.18.3
description: |
  Wellness bookable domain: studio / session / booking / instructor vertex
  types + their aspects and links, written by Create*/Tombstone*/Cancel*/Bind*
  ops. CreateSession claims a deterministic studioSlotClaim per covered
  15-minute cell (double-session lock, mirrors clinic-domain's
  providerSlotClaim). CreateBooking claims the first free sessionSeatClaim
  within the session's capacity (SessionFull once exhausted — the same
  CreateOnly idiom extended over a seat-index dimension), rejects a booking on
  an already-started/ended session (SessionInPast, mirroring clinic's
  ScheduleInPast) and a booker's second live booking on the same session
  (DoubleBooked, a deterministic per-(session, booker) sessionBookerClaim guard
  mirroring cafe's cafeOpenTabGuard, released by CancelBooking so a re-book
  re-claims it) and, given an
  optional leaseAppKey, verifies residency via lease-signing's applicationFor
  link before granting the resident rate (a mismatch falls through to
  standard, never a hard failure). BindInstructorIdentity binds an instructor
  to a real login identity via the identity-domain `provider` archetype role
  (persona-worlds-design.md Fire W0), mirroring clinic-domain's
  BindProviderIdentity; a bound instructor's TombstoneSession grant is
  confined, in-script, to sessions they lead. CancelBooking rejects once the
  session has begun (SessionStarted, the mirror of SetBookingAttendance's
  SessionNotStarted) or once attendance is already recorded
  (AttendanceRecorded — a marked booking can no longer be self-cancelled).
  SetBookingAttendance moves a
  booking's .status.value from booked to attended or noShow, carrying rate /
  seat / booker forward on an OCC upsert of the aspect's own revision (those
  fields now only matter to ReleaseOrphanedBooking, since a marked booking is
  no longer CancelBooking-eligible); either value corrects the other, a class that has
  not begun is rejected (SessionNotStarted, the mirror of SessionInPast), and
  the same standing guard confines a bound instructor to bookings on sessions
  they lead. Five plain projection lenses
  (wellnessStudios, wellnessSessions, wellnessBookings, wellnessInstructors,
  wellnessMembers) are the P5 read models a wellness FE reads; wellnessMembers
  carries each member's covering locations so the front desk's book-a-member
  picker offers only the members whose building the staffer works at, mirroring
  cafe-domain's cafeLeaseWorkplaces. wellnessIdentitiesRead is a PROTECTED
  Postgres SECURE LENS (Contract #3 §3.10) resolving a signed-in identity's
  own name — cmd/wellness-app reads it to render "Signed in as <name>"
  instead of a raw NanoID, mirroring loftspace-domain's applicantRosterRead.
  Each row anchors on its own identity NanoID PLUS every workplace building
  that covers the identity's own lease, so a worksAt-anchored front-desk or
  instructor actor can also resolve the name of any member whose lease their
  workplace covers, not only themselves. Depends
  lease-signing (documentation only — CreateBooking reads its leaseapp by
  known key, no install-order requirement enforced at the Starlark level).
  CreateBooking, CancelBooking, TombstoneSession, and SetBookingAttendance
  each carry an op-meta
  with the edge-manifest descriptor vocabulary (presentation/inputSchema/
  dispatch, edge-showcase-app-design.md §3.3, Fire 5 adoption) — metadata
  only; a client still needs a service-catalog path (permitsOperation) to
  discover these ops. TombstoneSession does not cascade to bookings, so
  ReleaseOrphanedBooking (operator-only, Weaver-dispatched, no op-meta)
  drains a still-booked booking whose session was tombstoned — the
  wellnessOrphanedBookingSettlement convergence lens/target computes the
  missing_release gap it fires on, mirroring clinic-ledger's no-show
  settlement idiom.
depends:
  - lease-signing
declares:
  ddls:
    - canonicalName: studio
      class: meta.ddl.vertexType
    - canonicalName: session
      class: meta.ddl.vertexType
    - canonicalName: booking
      class: meta.ddl.vertexType
    - canonicalName: instructor
      class: meta.ddl.vertexType
    - canonicalName: studioProfile
      class: meta.ddl.aspectType
    - canonicalName: sessionSchedule
      class: meta.ddl.aspectType
    - canonicalName: studioSlotClaim
      class: meta.ddl.aspectType
    - canonicalName: sessionSeatClaim
      class: meta.ddl.aspectType
    - canonicalName: sessionBookerClaim
      class: meta.ddl.aspectType
    - canonicalName: bookingStatus
      class: meta.ddl.aspectType
    - canonicalName: instructorProfile
      class: meta.ddl.aspectType
    - canonicalName: instructorIdentityClaim
      class: meta.ddl.aspectType
    - canonicalName: identityInstructorClaim
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: wellnessStudios
      adapter: nats-kv
      bucket: wellness-studios
      engine: full
    - canonicalName: wellnessSessions
      adapter: nats-kv
      bucket: wellness-sessions
      engine: full
    - canonicalName: wellnessBookings
      adapter: nats-kv
      bucket: wellness-bookings
      engine: full
    - canonicalName: wellnessInstructors
      adapter: nats-kv
      bucket: wellness-instructors
      engine: full
    - canonicalName: wellnessMembers
      adapter: nats-kv
      bucket: wellness-members
      engine: full
    - canonicalName: wellnessIdentitiesRead
      adapter: postgres
      engine: full
    - canonicalName: wellnessOrphanedBookingSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  permissions:
    - operationType: CreateStudio
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: TombstoneStudio
      scope: any
      grantsTo: [operator]
    - operationType: CreateSession
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: TombstoneSession
      scope: any
      grantsTo: [operator, provider]
    - operationType: CreateBooking
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: CreateBooking
      scope: self
      grantsTo: [consumer]
    - operationType: CancelBooking
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: CancelBooking
      scope: self
      grantsTo: [consumer]
    - operationType: SetBookingAttendance
      scope: any
      grantsTo: [operator, provider]
    - operationType: CreateInstructor
      scope: any
      grantsTo: [operator]
    - operationType: TombstoneInstructor
      scope: any
      grantsTo: [operator]
    - operationType: SetInstructorProfile
      scope: any
      grantsTo: [operator, provider]
    - operationType: BindInstructorIdentity
      scope: any
      grantsTo: [operator]
    - operationType: ReleaseOrphanedBooking
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: wellnessOrphanedBookingSettlement
      lensRef: wellnessOrphanedBookingSettlement
  opMetas:
    - operationType: CreateBooking
    - operationType: CancelBooking
    - operationType: TombstoneSession
    - operationType: SetBookingAttendance
    - operationType: CreateSession
    - operationType: CreateStudio
    - operationType: SetInstructorProfile
