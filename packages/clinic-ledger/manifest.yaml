name: clinic-ledger
version: 0.8.0
description: |
  Clinic patient payment ledger: the clinicaccount vertex type (ClinicCreateAccount,
  independently-minted id, one per patient via a .ledgerAccount guard aspect
  on the patient, plus a .balance aspect maintained O(1) by every posted
  entry) + the clinictransaction vertex type (ClinicDebitAccount /
  ClinicCreditAccount, append-only entries linked to the account via postedTo,
  each also updating the account's .balance aspect by the signed amount (a bare,
  auto-conditioned, retry-eligible update); a
  debit entry carries a bounded billedTo self|insurance + optional
  expectedReimbursementCents payer dimension, and an optional appointmentRef
  back-ref; a credit entry carries reason payment|waiver, default payment, and
  an optional reversesRef back-ref to the debit it reverses) +
  the clinicLedgerHistory read-model lens (one row per
  transaction) + the clinicPatientAccounts lens (patient -> account key
  lookup) + the clinicNoShowSettlement Weaver playbook (lazily opens the
  account via ClinicCreateAccount, auto-charges the fee an appointment's
  status carries — a no-show fee, or the late-cancellation fee a patient's
  own cancel inside the 24-hour window owes — then auto-reverses that charge
  via ClinicCreditAccount if a CorrectAppointmentStatus correction later
  moves the appointment to a fee-less status). All
  three ops grant front-of-house staff alongside the operator, unconfined.
  ClinicCreditAccount ALSO grants a patient scope=self (pay down their own
  balance, never waive it — reason:"waiver" is rejected server-side for a
  self-scoped submit) — ownership proven server-side against the account's own
  heldFor->patient->identifiedBy topology, and the amount capped at the
  account's maintained .balance aspect (O(1), not a full-history replay). The
  key that cap reads is hydrated by the transaction DDL's own derive_reads, so
  the update it conditions never rests on a declaration the submitter writes.
  Also ships the arrears reminder: the account's .arrears episode aspect (a
  charge against an account that owed nothing records the due date its own
  postedAt implies; a payment that clears the balance ends the episode; a
  partial one marks it stale) + the clinicArrearsReminders weaver-target
  convergence lens, whose playbook dispatches EvaluateClinicArrears — that op
  ages the account with the same FIFO the patient's statement runs and fires
  ONE external.notification per arrears episode to the bridge's "notification"
  adapter, keyed on (accountKey, dueAt). RecordClinicArrearsReminderNotification
  records the outcome as an audit-only aspect. No clinic op refuses a debtor.
  Depends clinic-domain + orchestration-base.
depends:
  - clinic-domain
  - orchestration-base
declares:
  ddls:
    - canonicalName: clinicaccount
      class: meta.ddl.vertexType
    - canonicalName: clinicLedgerAccountGuard
      class: meta.ddl.aspectType
    - canonicalName: clinicAccountBalance
      class: meta.ddl.aspectType
    - canonicalName: clinicAccountArrears
      class: meta.ddl.aspectType
    - canonicalName: clinictransaction
      class: meta.ddl.vertexType
    - canonicalName: clinicArrearsNotificationOp
      class: meta.ddl.vertexType
    - canonicalName: clinicAccountArrearsNotification
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: clinicLedgerHistory
      adapter: nats-kv
      bucket: clinic-ledger-history
      engine: full
    - canonicalName: clinicPatientAccounts
      adapter: nats-kv
      bucket: clinic-patient-accounts
      engine: full
    - canonicalName: clinicNoShowSettlement
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
    - canonicalName: clinicArrearsReminders
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  opMetas:
    - operationType: ClinicCreateAccount
    - operationType: ClinicDebitAccount
    - operationType: ClinicCreditAccount
    - operationType: EvaluateClinicArrears
    - operationType: RecordClinicArrearsReminderNotification
  permissions:
    - operationType: ClinicCreateAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: ClinicDebitAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: ClinicCreditAccount
      scope: any
      grantsTo: [operator, frontOfHouse]
    - operationType: ClinicCreditAccount
      scope: self
      grantsTo: [consumer]
    - operationType: EvaluateClinicArrears
      scope: any
      grantsTo: [operator]
    - operationType: RecordClinicArrearsReminderNotification
      scope: any
      grantsTo: [operator]
  weaverTargets:
    - targetId: clinicNoShowSettlement
      lensRef: clinicNoShowSettlement
    - targetId: clinicArrearsReminders
      lensRef: clinicArrearsReminders
