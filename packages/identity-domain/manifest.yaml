name: identity-domain
version: 0.20.8
description: |
  Identity vertex creation, claim, and state-machine management. Provides
  CreateUnclaimedIdentity, UpdateIdentityState, ClaimIdentity, RotateClaimKey,
  RecordIdentityPII, ProvisionConsumerIdentity, InitiateCredentialLink,
  CompleteCredentialLink, UnlinkCredential, ReconcileCredentialBinding,
  UnbindIdentityCredentials — the erasure plane's credential sweep, submitted
  only by the orchestration service actors — and
  TombstoneOrphanedCredentialIndex, the operator-run cleanup for a
  credentialindex vertex whose boundTo link is gone and one of whose two
  endpoints has been erased, where no boundTo walk can reach it — covering
  both directions of that residue (the erased subject as the row's owner, and
  the erased subject as the row's credential), and on the outbound one also
  rewriting the live owner's credentialBinding array so their sign-in-methods
  list stops naming the erased credential. Depends on rbac-domain. The
  consumer, frontOfHouse, backOfHouse, provider, and identityProvisioner
  roles are declared in the package definition and created in the single
  install batch routed through the Processor (Story 1.5.5).
depends:
  - rbac-domain
declares:
  ddls:
    - canonicalName: identity
      class: meta.ddl.vertexType
    - canonicalName: ssn
      class: meta.ddl.aspectType
    - canonicalName: dob
      class: meta.ddl.aspectType
    - canonicalName: name
      class: meta.ddl.aspectType
    - canonicalName: email
      class: meta.ddl.aspectType
    - canonicalName: phone
      class: meta.ddl.aspectType
    - canonicalName: claimKey
      class: meta.ddl.aspectType
    - canonicalName: linkKey
      class: meta.ddl.aspectType
    - canonicalName: credentialBinding
      class: meta.ddl.aspectType
    - canonicalName: idpBinding
      class: meta.ddl.aspectType
    - canonicalName: indexes
      class: meta.ddl.linkType
    - canonicalName: duplicateOf
      class: meta.ddl.linkType
    - canonicalName: boundTo
      class: meta.ddl.linkType
    - canonicalName: actorRevocation
      class: meta.ddl.vertexType
    - canonicalName: gateway.actorRevoked
      class: meta.ddl.eventType
    - canonicalName: gateway.actorUnrevoked
      class: meta.ddl.eventType
    - canonicalName: unbindIdentityCredentials
      class: meta.ddl.vertexType
    - canonicalName: tombstoneOrphanedCredentialIndex
      class: meta.ddl.vertexType
  lenses:
    - canonicalName: identityIndexHint
      adapter: nats-kv
      bucket: identity-index-hint
      engine: full
    - canonicalName: identityCredentialsRead
      adapter: postgres
      table: read_identity_credentials
      engine: full
      protected: true
    - canonicalName: identityCredentialBindingsRead
      adapter: postgres
      table: read_identity_credential_bindings
      engine: full
      protected: true
    - canonicalName: identityAnchors
      adapter: nats-kv
      bucket: identity-anchors
      engine: full
  permissions:
    - operationType: CreateUnclaimedIdentity
      scope: any
      grantsTo: [frontOfHouse, backOfHouse, operator]
    - operationType: UpdateIdentityState
      scope: any
      grantsTo: [operator]
    - operationType: ClaimIdentity
      scope: self
      grantsTo: [consumer]
    - operationType: RotateClaimKey
      scope: any
      grantsTo: [frontOfHouse, backOfHouse, operator]
    - operationType: RecordIdentityPII
      scope: any
      grantsTo: [frontOfHouse, backOfHouse, operator]
    - operationType: ProvisionConsumerIdentity
      scope: any
      grantsTo: [identityProvisioner, operator]
    - operationType: InitiateCredentialLink
      scope: self
      grantsTo: [consumer]
    - operationType: CompleteCredentialLink
      scope: self
      grantsTo: [consumer]
    - operationType: UnlinkCredential
      scope: self
      grantsTo: [consumer]
    - operationType: UnbindIdentityCredentials
      scope: any
      grantsTo: [operator]
    - operationType: ReconcileCredentialBinding
      scope: any
      grantsTo: [operator]
    - operationType: TombstoneOrphanedCredentialIndex
      scope: any
      grantsTo: [operator]
    - operationType: RevokeActor
      scope: any
      grantsTo: [operator]
    - operationType: UnrevokeActor
      scope: any
      grantsTo: [operator]
  opMetas:
    - operationType: CreateUnclaimedIdentity
    - operationType: RotateClaimKey
    - operationType: ClaimIdentity
    - operationType: RecordIdentityPII
    - operationType: UnlinkCredential
    - operationType: CompleteCredentialLink
