name: maintenance-domain
version: 0.3.0
description: |
  Cross-vertical maintenance work orders: vtx.workorder.<NanoID> raised at a
  location by ReportIssue and closed by ResolveWorkOrder, the op an FR28
  role-queued task grants its claimant (the §10.6 auto-complete closes the
  task, so no separate completion op exists). `.resolution` is the
  read-before-write terminal marker — an identical re-submit is an idempotent
  no-op so an offline device's drain retry cannot fail the work, a differing
  one is rejected so a resolution never silently flips. Both ops carry F4's
  canonical workplace write-confinement guard on the standing path;
  ReportIssue additionally admits a consumer on a scope=self grant bound to
  the unit they residesIn. The workOrderQueue lens + weaverTarget queue every
  unresolved, untasked work order as a ResolveWorkOrder task to backOfHouse,
  so a reported issue becomes work without the reporter minting the task.
  ResolveWorkOrder carries an op-meta with the full edge-manifest descriptor
  vocabulary (presentation/inputSchema/dispatch authContext=task) so a Facet
  client can render and submit it from the task row alone.
depends:
  - location-domain
declares:
  ddls:
    - canonicalName: workOrder
      class: meta.ddl.vertexType
    - canonicalName: workOrderReport
      class: meta.ddl.aspectType
    - canonicalName: workOrderResolution
      class: meta.ddl.aspectType
  lenses:
    - canonicalName: workOrderQueue
      adapter: nats-kv
      bucket: weaver-targets
      engine: full
  permissions:
    - operationType: ReportIssue
      scope: any
      grantsTo: [operator, frontOfHouse, backOfHouse]
    - operationType: ReportIssue
      scope: self
      grantsTo: [consumer]
    - operationType: ResolveWorkOrder
      scope: any
      grantsTo: [operator]
  opMetas:
    - operationType: ResolveWorkOrder
    - operationType: ReportIssue
  weaverTargets:
    - targetId: workOrderQueue
      lensRef: workOrderQueue
