<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wellness</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">Wellness <span class="brand-sub">studio scheduling</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="schedule" role="tab" aria-selected="true">Schedule</button>
    <button class="tab" data-view="myclasses" role="tab" aria-selected="false">My Classes</button>
    <button class="tab" id="tab-roster" data-view="roster" role="tab" aria-selected="false" hidden>Roster</button>
    <button class="tab" id="tab-studios" data-view="studios" role="tab" aria-selected="false" hidden>Studios</button>
  </nav>
</header>

<div id="me-bar" class="me-bar">
  <span id="me-status" class="me-status"></span>
  <button id="sign-out" class="ghost" hidden>Sign out</button>
</div>

<main>
  <section id="view-schedule" role="tabpanel">
    <div class="panel-controls">
      <label for="schedule-studio">Studio</label>
      <select id="schedule-studio"></select>
      <button id="schedule-refresh" class="ghost">Refresh</button>
      <span class="summary" id="schedule-summary"></span>
    </div>
    <div id="schedule-grid" class="grid" aria-live="polite"></div>
  </section>

  <section id="view-myclasses" role="tabpanel" hidden>
    <div class="panel-controls">
      <button id="myclasses-refresh" class="ghost">Refresh</button>
      <span class="summary" id="myclasses-summary"></span>
    </div>
    <div id="myclasses-balance" class="ledger-balance"></div>
    <ul id="myclasses-ledger-list" class="ledger-list" aria-live="polite"></ul>
    <div id="myclasses-ledger-empty" class="empty" hidden>No charges yet.</div>
    <div id="myclasses-body"></div>
  </section>

  <section id="view-roster" role="tabpanel" hidden>
    <div class="panel-controls">
      <label for="roster-session">Session</label>
      <select id="roster-session"></select>
      <button id="roster-refresh" class="ghost">Refresh</button>
      <span class="summary" id="roster-summary"></span>
    </div>
    <div id="roster-book" class="session-form" hidden>
      <div class="field">
        <label for="roster-book-member">Book a member in</label>
        <select id="roster-book-member"></select>
      </div>
      <button id="roster-book-submit">Book</button>
      <div class="field">
        <label for="roster-book-guest">Book a guest (identity key, standard rate)</label>
        <input type="text" id="roster-book-guest" placeholder="vtx.identity.…">
      </div>
      <button id="roster-book-guest-submit" class="ghost">Book guest</button>
    </div>
    <div id="roster-body"></div>

    <div id="roster-billing" class="session-form" hidden>
      <h2 style="margin: 0 0 8px; font-size: 15px;">Billing</h2>
      <div class="field">
        <label for="billing-member">Member</label>
        <select id="billing-member"></select>
      </div>
      <div id="billing-balance" class="ledger-balance"></div>
      <ul id="billing-list" class="ledger-list" aria-live="polite"></ul>
      <div id="billing-empty" class="empty" hidden>No charges or payments recorded yet.</div>
      <div class="ledger-record-form">
        <input type="number" id="billing-amount" step="0.01" min="0.01" placeholder="Amount ($)" aria-label="Amount in dollars" />
        <input type="text" id="billing-memo" placeholder="Memo (optional)" aria-label="Memo" />
        <button type="button" id="billing-charge" class="ghost">+ Record charge</button>
        <button type="button" id="billing-payment" class="ghost">+ Record payment</button>
      </div>
    </div>
  </section>

  <section id="view-studios" role="tabpanel" hidden>
    <div class="panel-controls">
      <label>Studios</label>
      <button id="studio-new-toggle" class="ghost">New studio</button>
      <button id="studios-refresh" class="ghost">Refresh</button>
      <span class="summary" id="studios-summary"></span>
    </div>
    <div id="studio-new-form" class="session-form" hidden>
      <div class="field">
        <label for="studio-new-name">Studio name</label>
        <input type="text" id="studio-new-name" placeholder="e.g. Flow Room" maxlength="120" />
      </div>
      <div class="meta" id="studio-new-where"></div>
      <button id="studio-new-create">Open studio</button>
    </div>
    <div id="studios-grid" class="grid" aria-live="polite"></div>

    <div id="instructors-section">
      <div class="panel-controls">
        <label>Instructors</label>
        <button id="instructor-new-toggle" class="ghost">New instructor</button>
        <button id="instructors-refresh" class="ghost">Refresh</button>
        <span class="summary" id="instructors-summary"></span>
      </div>
      <div id="instructor-new-form" class="session-form" hidden>
        <div class="field">
          <label for="instructor-new-name">Instructor name</label>
          <input type="text" id="instructor-new-name" placeholder="e.g. Kai Nakamura" maxlength="120" />
        </div>
        <div class="field">
          <label for="instructor-new-studio">Studio (optional)</label>
          <select id="instructor-new-studio"></select>
        </div>
        <button id="instructor-new-create">Add instructor</button>
      </div>
      <div id="instructors-grid" class="grid" aria-live="polite"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
