<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Café</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">Café <span class="brand-sub">house tabs</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="pos" id="tab-pos" role="tab" aria-selected="true">POS</button>
    <button class="tab" data-view="frontdesk" id="tab-frontdesk" role="tab" aria-selected="false">Front Desk</button>
    <button class="tab" data-view="menu" id="tab-menu" role="tab" aria-selected="false">Manage Menu</button>
    <button class="tab" data-view="resident" id="tab-resident" role="tab" aria-selected="false">Resident</button>
  </nav>
</header>

<div id="me-bar" class="me-bar">
  <span id="me-status" class="me-status"></span>
  <button id="sign-out" class="ghost" hidden>Sign out</button>
</div>

<main>
  <section id="view-pos" role="tabpanel">
    <div class="panel-controls">
      <label for="pos-lease">Lease</label>
      <select id="pos-lease"></select>
      <button id="pos-refresh" class="ghost">Refresh</button>
      <span class="summary" id="pos-summary"></span>
    </div>
    <div id="pos-body"></div>
  </section>

  <section id="view-frontdesk" role="tabpanel" hidden>
    <div class="panel-controls">
      <button id="frontdesk-refresh" class="ghost">Refresh</button>
      <span class="summary" id="frontdesk-summary"></span>
    </div>
    <ul id="frontdesk-arrears" class="ledger-list" aria-live="polite"></ul>
    <div id="frontdesk-arrears-empty" class="empty" hidden>Nobody owes money right now.</div>
    <div id="frontdesk-grid" class="grid" aria-live="polite"></div>
  </section>

  <section id="view-menu" role="tabpanel" hidden>
    <div class="panel-controls">
      <button id="menu-refresh" class="ghost">Refresh</button>
      <span class="summary" id="menu-summary"></span>
    </div>
    <div class="panel">
      <h2>Add a menu item</h2>
      <p class="lead">Price is fixed at creation — to change a price, retire the item below and add it again.</p>
      <form id="add-menu-item-form">
        <div class="field-row">
          <div class="field">
            <label for="mi-name">Name</label>
            <input type="text" id="mi-name" placeholder="Cappuccino" />
          </div>
          <div class="field">
            <label for="mi-price">Price</label>
            <input type="text" id="mi-price" inputmode="decimal" placeholder="4.50" />
          </div>
        </div>
        <div class="panel-actions">
          <button type="submit" id="add-menu-item-submit">Add item</button>
        </div>
      </form>
    </div>
    <div id="menu-body"></div>
  </section>

  <section id="view-resident" role="tabpanel" hidden>
    <div class="panel-controls">
      <label id="resident-lease-label" for="resident-lease">Lease</label>
      <select id="resident-lease"></select>
      <button id="resident-refresh" class="ghost">Refresh</button>
    </div>
    <div id="resident-body"></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
