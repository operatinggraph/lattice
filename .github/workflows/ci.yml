      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run shard-4 tests (unit + integration)
        env:
          POSTGRES_TEST_DSN: postgres://lattice:lattice_dev@localhost:5432/lattice?sslmode=disable
        run: >-
          go test -count=1 -p 4 -timeout 10m
          ./cmd/bootstrap/... ./cmd/bridge/... ./cmd/cafe-app/... ./cmd/chronicler/...
          ./cmd/edge/... ./cmd/edge-wasm/... ./cmd/facet/... ./cmd/lattice/...
          ./cmd/lattice-pkg/... ./cmd/loom/... ./cmd/model-runner/... ./cmd/object-store-manager/...
          ./cmd/processor/... ./cmd/weaver/... ./deploy/... ./examples/...
          ./internal/bypass/... ./internal/capabilitykv/... ./internal/edge/...
          ./internal/modelrunner/... ./internal/descriptorform/...
          ./internal/guardgrammar/... ./internal/healthkv/... ./internal/jsstore/...
          ./internal/lenstest/... ./internal/opstatus/...
          ./internal/spike/... ./internal/starlarksandbox/... ./internal/substrate/...
          ./packages/clinic-domain/... ./packages/clinic-reminders/...
          ./packages/control-authz/... ./packages/location-domain/...
          ./packages/loftspace-domain/... ./packages/maintenance-domain/...
          ./packages/privacy-base/... ./scripts/...

  unit-natsperm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # internal/natsperm carries no Postgres-gated test (no skipIfNoPostgres,
    # no POSTGRES_TEST_DSN reference in the package) and no JetStream/file
    # state shared with any other shard, so it needs neither a postgres
    # service nor to share a runner with unit-4 — it only used to because it
    # was a step, not a job. Running it as its own job lets it execute
    # concurrently with unit-4's remaining glob instead of serializing after
    # it, cutting it off the wall-clock of whichever job it used to ride.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run the NATS permission-matrix suite (own -parallel budget)
        # This package gets its own invocation for one reason: -parallel.
        # Its cost is ~528 leaf subtests that each open an auth-callout
        # connection and then wait out the full 500ms deniedTimeout, because a
        # denied publish never receives a reply — so the suite is ~13% CPU and
        # essentially all waiting. At the default -parallel (GOMAXPROCS, 4 on
        # this runner) only four of those waits overlap and the package alone
        # runs ~3 minutes, enough to make it the pipeline's long pole; at 24 it
        # runs ~30s. Every other package stays on the default glob invocation.
        # (-p tunes package-level concurrency and is moot for a single package.)
        #
        # 24, not higher: 32 is measurably faster still but buys no wall-clock,
        # since another job is the pipeline pole well above either figure — the
        # slack is worth more as headroom against a contended runner. The
        # fixture's own AuthTimeout override is what makes that headroom real.
        # Coverage is unchanged: same suite, same vectors, more of the waiting
        # overlapped. unit-shard-coverage below counts this package as covered.
        run: go test -count=1 -parallel 24 -timeout 10m ./internal/natsperm/...

  edge-browser-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The browser Edge node's store is the one engine half that cannot be
    # proven by any other job here: bbolt's suite says nothing about
    # IndexedDB, and the js/wasm build check in lint-build only proves the
    # port compiles. This runs the SAME conformance suite against a real
    # IndexedDB in the runner image's headless Chrome, so a port that
    # compiles but breaks the last-writer-wins gate, FIFO order, or
    # durability across a reopen fails here rather than in a user's tab.
    # Its own job (not a shard) because it is the only one needing a browser.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Allow Chrome's sandbox to start
        # The runner image ships Chrome but, being Ubuntu 23.10+, restricts
        # unprivileged user namespaces via AppArmor — so Chrome finds "no usable
        # sandbox" and aborts before any test runs. Re-enable the namespace
        # rather than passing --no-sandbox: this job runs a real browser, and
        # keeping its sandbox costs one line. Guarded so it is a no-op on an
        # image without the knob rather than a failure.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run the Edge IndexedDB store conformance suite
        run: make test-edge-idb-conformance

  unit-shard-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Assert the unit jobs' package globs union to exactly `go list ./...`
        # A fast (no Docker) guard against silent coverage loss: a package
        # added later that isn't sorted into any shard's glob list above
        # would otherwise never run in CI again. The list below is unit-1..
        # unit-4's four globs plus internal/natsperm and internal/refractor,
        # which run in their own jobs (unit-natsperm, unit-refractor) rather
        # than inside any shard's glob.
        run: |
          go list ./... | sort -u > /tmp/all.txt
          go list \
            ./cmd/gateway/... ./cmd/loupe/... ./cmd/wellness-app/... \
            ./internal/chronicler/... \
            ./internal/identityceremony/... \
            ./internal/pkgregistry/... \
            ./internal/testutil/... ./internal/weaver/... \
            ./packages/console-operator/... ./packages/front-desk/... \
            ./packages/privacy-operator-grant/... \
            ./packages/rbac-domain/... \
            ./packages/wellness-reminders/... \
            ./cmd/loftspace-app/... ./internal/bridge/... ./internal/controlauth/... \
            ./internal/objectcrypto/... ./internal/privacyworker/... \
            ./internal/processor/... ./packages/cafe-ledger/... \
            ./packages/capability-author/... ./packages/demo-operator/... \
            ./packages/edge-manifest/... ./packages/lease-signing/... \
            ./packages/loftspace-ledger/... ./packages/objects-base/... \
            ./packages/one-bill/... ./packages/service-location/... \
            ./packages/wellness-domain/... \
            ./cmd/clinic-app/... ./cmd/refractor/... ./internal/aiagent/... \
            ./internal/appsession/... ./internal/bootstrap/... ./internal/gateway/... \
            ./internal/loom/... ./internal/natsfixture/... ./internal/objectmanager/... \
            ./internal/pkgmgr/... ./internal/projectionhealth/... ./internal/vault/... \
            ./packages/augur/... ./packages/cafe-domain/... ./packages/clinic-ledger/... \
            ./packages/identity-domain/... ./packages/identity-hygiene/... \
            ./packages/orchestration-base/... ./packages/semantic-contracts/... \
            ./packages/service-domain/... ./packages/wellness-ledger/... \
            ./cmd/bootstrap/... ./cmd/bridge/... ./cmd/cafe-app/... ./cmd/chronicler/... \
            ./cmd/edge/... ./cmd/edge-wasm/... ./cmd/facet/... ./cmd/lattice/... \
            ./cmd/lattice-pkg/... ./cmd/loom/... ./cmd/model-runner/... ./cmd/object-store-manager/... \
            ./cmd/processor/... ./cmd/weaver/... ./deploy/... ./examples/... \
            ./internal/bypass/... ./internal/capabilitykv/... ./internal/edge/... \
            ./internal/modelrunner/... ./internal/descriptorform/... \
            ./internal/guardgrammar/... ./internal/healthkv/... ./internal/jsstore/... \
            ./internal/lenstest/... ./internal/natsperm/... ./internal/opstatus/... \
            ./internal/refractor/... \
            ./internal/spike/... ./internal/starlarksandbox/... ./internal/substrate/... \
            ./packages/clinic-domain/... ./packages/clinic-reminders/... \
            ./packages/control-authz/... ./packages/location-domain/... \
            ./packages/loftspace-domain/... ./packages/maintenance-domain/... \
            ./packages/privacy-base/... ./scripts/... \
            | sort -u > /tmp/sharded.txt
          diff /tmp/all.txt /tmp/sharded.txt && echo "OK: shards cover exactly go list ./..."

  edge-consumer-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # The browser Edge node's NATS transport is the vendored nats.js client
    # (internal/edge/browser/shell), not nats.go, so its create-consumer wire
    # form can differ from the Go node's and fail CLOSED in a user's tab while
    # every Go test passes. This job drives the REAL shell from Node against
    # internal/natsperm's real per-identity auth-callout and asserts nats.js
    # emits the ACL-granted $JS.API.CONSUMER.CREATE.SYNC.<durable>.<filter> form
    # (fail-closed if not), plus the multi-tab leader-election unit vectors.
    # Needs Node (for the vendored client) + Go (for the callout harness); no
    # Docker or shared stack. Its own job because it is the only one needing Node.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          # Node 22: the vendored nats.js browser client's wsconnect needs a
          # global WebSocket, which is stable (unflagged) only from Node 22 —
          # Node 20 has none and every parity vector fails to connect.
          node-version: "22"

      - name: Run the Edge consumer-create wire-form parity + leader-election gate
        run: make test-edge-consumer-parity

      # The Facet renderer's feed-source swap (EDGE.5 W4): app.js reads its
      # frames from a pluggable source — the Go host's SSE feed or the
      # browser-native engine's in-page onFrame. These vectors pin both adapters
      # + boot.mjs's wiring. Node only, so it rides this Node-equipped job.
      - name: Run the Facet renderer unit vectors (feed-source swap)
        run: make test-facet-web

      # The shared staff-plane op-form renderer (internal/descriptorform/
      # form.mjs, staff-descriptor-rendering-design.md §13): schema-to-
      # field-kind detection, template substitution, and authContext
      # assembly for every cmd/{loftspace,clinic,cafe,wellness}-app. Node
      # only, so it rides this same Node-equipped job.
      - name: Run the shared descriptor-form renderer unit vectors
        run: make test-descriptorform
