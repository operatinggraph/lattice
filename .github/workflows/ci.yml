      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run shard-3 tests (unit + integration)
        env:
          POSTGRES_TEST_DSN: postgres://lattice:lattice_dev@localhost:5432/lattice?sslmode=disable
        run: >-
          go test -count=1 -p 4 -timeout 10m
          ./cmd/clinic-app/... ./cmd/refractor/... ./internal/aiagent/...
          ./internal/appsession/... ./internal/bootstrap/... ./internal/gateway/...
          ./internal/loom/... ./internal/natsfixture/... ./internal/objectmanager/...
          ./internal/pkgmgr/... ./internal/projectionhealth/... ./internal/vault/...
          ./packages/augur/... ./packages/cafe-domain/... ./packages/clinic-ledger/...
          ./packages/identity-domain/... ./packages/identity-hygiene/...
          ./packages/orchestration-base/... ./packages/semantic-contracts/...
          ./packages/service-domain/... ./packages/wellness-ledger/...

  unit-4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice_dev
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
