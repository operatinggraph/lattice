name: CI

on:
  push:
    branches: [main]
    paths-ignore: &doc-paths
      - '**/*.md'
      - 'docs/**'
      - '_bmad/**'
      - '_bmad-output/**'
      - 'agents/**'
      - 'website/**'
      - 'LICENSE'
  pull_request:
    paths-ignore: *doc-paths
  workflow_dispatch: {}

# Independent jobs run concurrently; wall-clock is the slowest job, not
# the sum. Every gate that ran in the old single serial job still runs, each in
# exactly one job:
#   lint-build         — build, build-wasm, nats-confinement, vet, gofmt (no Docker)
#   lint-static        — golangci + the 19 STRICT scripts/lint-*.go gates,
#                         split off lint-build so the compile/vet half and the
#                         static-analysis half run in parallel instead of
#                         serially — lint-build's own wall-clock (Build+Vet+
#                         Lint+16 scripts, ~170-210s measured) had become a
#                         tied pole with the unit shards (backlog: "unit-4/
#                         lint-build now the poles"). Split by INDEPENDENCE,
#                         not by runtime alone: nothing here reads `bin/` or
#                         any output `make build`/`make vet` produce, so the
#                         two jobs share no state past the checked-out tree
#                         and a fresh module cache restore.               (no Docker)
#   stack-gates        — make up → verify-kernel → 12× verify-package →
#                         hello-lattice → health-completeness        (Docker)
#   convergence        — lease-convergence, object-gc, augur-convergence,
#                         unrouted-convergence, crypto-shred,
#                         system-actor-capability, control-plane-authz
#                                                                     (no Docker, embedded NATS)
#   unit-1..unit-4       — go test ./... -p 4, split into four weight-balanced
#                         package-glob shards (unit was the long pole — one
#                         `go test ./...` took ~2x any other job; a 2-way then
#                         3-way split still left unit-2/unit-3 as the pole,
#                         because the 3-way split was sized off per-package
#                         test-file LOC, which tracks package size, not the
#                         actual I/O-bound wall-clock cost of a NATS/Postgres
#                         integration test. This 4-way split is sized off
#                         MEASURED `go test -json` per-package elapsed time
#                         instead (re-derive with
#                         `go test ./... -p 4 -json | jq -rs 'group_by(.Package)...'`
#                         summed per package, never from memory or from LOC —
#                         a slow test added later skews this and re-splitting
#                         off fresh measurements is the fix, not a bigger
#                         timeout). unit-1 was still measurably the shard pole
#                         (~200-210s vs ~130-150s for unit-2/3/4) because
#                         internal/refractor alone (its own package, not
#                         counting its Postgres-gated adapter/pipeline/
#                         ruleengine subtrees) measured ~150s solo — see
#                         unit-refractor below, which now carries it.        (each a Postgres
#                                                                     service container;
#                                                                     otherwise no Docker,
#                                                                     embedded NATS)
#   unit-refractor      — internal/refractor/... alone (the package that made
#                         unit-1 the pole), split off the same way natsperm
#                         was split off unit-4: it shares no JetStream/file
#                         state with unit-1's remaining glob, so isolating it
#                         lets both halves run at their own pace instead of
#                         one dominating the other's job. Carries its own
#                         Postgres service (structural_pause_recovery_e2e_test.go
#                         + the adapter/pipeline/ruleengine/full subtrees) and
#                         the isolated p99 latency gate step (unchanged
#                         reasoning, moved verbatim from unit-1).    (Postgres
#                                                                     service container;
#                                                                     embedded NATS)
#   unit-natsperm       — internal/natsperm alone, outside the unit-1..unit-4
#                         globs, so that package alone can take a higher
#                         -parallel (see the job for why) and run concurrently
#                         with unit-4 instead of serializing after it.
#                                                                     (no Docker,
#                                                                     embedded NATS)
#   unit-shard-coverage — asserts those globs plus internal/natsperm union to
#                         EXACTLY `go list ./...`, so a newly added package
#                         that isn't sorted into any shard fails CI loudly
#                         instead of silently skipping                (no Docker)
jobs:
  lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Build
        run: make build

      - name: Build Edge engine for the browser target
        # The Edge engine's semantics are single-sourced in Go and compiled to
        # wasm for the browser node (edge-browser-node-design.md §3.2). The
        # store's browser half is now executed too (see the conformance job);
        # this check still earns its place by covering the packages that job
        # does not run, so an import that cannot build for a browser — bbolt
        # above all — can never re-enter the engine unnoticed.
        run: GOOS=js GOARCH=wasm go build ./internal/edge/... ./cmd/edge-wasm/...

      - name: Assert the browser Edge engine cannot reach a NATS client
        # The browser node's only sanctioned write door is the Gateway (Fetch)
        # and its only read door is the JS shell's WebSocket; a linked nats.go
        # is both dead weight in the artifact and a trusted transport waiting to
        # be wired around that boundary. The build check above cannot see this —
        # nats.go compiles for js/wasm quite happily — so the confinement is
        # asserted here, at the dependency level, over the same package set.
        #
        # This is the assertion the wire-type extraction bought: the DTOs the
        # engine needs live in leaf packages (opwire / controlwire / healthwire /
        # vaultwire / substrate keys), so reaching a NATS client now takes a
        # deliberate import rather than a struct reference.
        run: |
          deps=$(GOOS=js GOARCH=wasm go list -deps ./internal/edge/... ./cmd/edge-wasm/...)
          if echo "$deps" | grep -q '^github.com/nats-io/'; then
            echo "::error::the js/wasm Edge engine reaches a NATS client:"
            echo "$deps" | grep '^github.com/nats-io/'
            echo "The browser engine talks to the Gateway, not to NATS directly."
            echo "See edge-browser-node-design.md §3.2/§3.3."
            exit 1
          fi
          echo "OK: no github.com/nats-io/* in the js/wasm engine dependency graph."

      - name: Vet
        run: make vet

      - name: Gofmt (whole tree, including build-ignored files)
        # golangci-lint's gofmt linter only analyses files that belong to a
        # package go/packages can load, and every scripts/*.go opens with
        # `//go:build ignore` — so that whole tree is invisible to golangci
        # (which runs in the lint-static job). This walks the working tree
        # directly.
        run: |
          # gofmt -l exits non-zero with EMPTY stdout and a stderr diagnostic
          # when a file will not parse, so the listing alone cannot be the
          # verdict — an unparseable file would otherwise read as "clean".
          # The status is checked explicitly rather than left to set -e, which
          # does not reliably fire on a command substitution in an assignment.
          if ! unformatted=$(gofmt -l .); then
            echo "gofmt: failed to parse one or more files (diagnostic above)"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "gofmt: the following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

  lint-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Lint
        # skip-cache: a restored analysis cache makes the verdict depend on
        # which packages the run happened to re-analyze. staticcheck's
        # interprocedural facts (e.g. that t.Fatalf does not return) are lost
        # for packages served from cache, so SA5011 fires on correct code in
        # some runs and not others — the same commit linting clean or dirty by
        # cache state alone. A full analysis every run is the only verdict
        # that means anything.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          skip-cache: true

      - name: Conventions lint (CLAUDE.md key-shapes + no history comments)
        # Static check: rejects `asp.` key prefixes (Contract #1) and
        # history/changelog comments. STRICT=1 fails the build on any finding.
        run: STRICT=1 go run ./scripts/lint-conventions.go

      - name: Web-asset derived-key lint (no client-side hash-to-NanoID port)
        # The G2 ban's web half. A .js/.mjs file carrying the Contract #1 NanoID
        # alphabet AND computing a SHA-256 digest has re-implemented
        # substrate.SHA256NanoID in the browser; a key derived that way from an
        # op payload belongs to the owning DDL's derive_reads (Contract #2 §2.5
        # class (g)). Anything else declares `// derived-key: <reason>`.
        run: STRICT=1 go run ./scripts/lint-web.go

      - name: Lens read-grant walk lint (dual-enumeration seam)
        # A Personal (nats-subject) lens that anchors on anything but the actor
        # must declare its actor→anchor `Walk`, so pkgmgr compiles the read-grant
        # producer that grants those anchors — otherwise Refractor's D1 gate
        # silently drops every row of that lens. A Path-B cap-read producer must
        # be generated from those walks, never hand-authored beside them.
        # STRICT=1 fails the build on either violation.
        run: STRICT=1 go run ./scripts/lint-lens-anchors.go

      - name: Cap-read producer closure gate (authoring half)
        # Refractor's D1 read gate finds its rows by a WILDCARD listing over
        # cap-read.*, so any lens writing that namespace is read as a live
        # grant whether or not the platform has ever heard of it. A lens that
        # cannot carry the grant-change edge — not actorAggregate, not
        # per-entry, not auth-plane, or a key pattern whose inverse cannot name
        # the actor — therefore writes grants nothing ever hears withdrawn. It
        # calls projection.CapReadWriterRefusal, the same predicate the runtime
        # installer calls, so the two cannot diverge.
        #
        # SCOPE, stated plainly: the internal/bootstrap arm inspects the
        # kernel's real base producer, but the packages/** arm is PREVENTIVE
        # ONLY — the three shipped generated producers are composed at install
        # time by internal/pkgmgr/anchorwalk.go and are not literals in any
        # package's source, so this gate never sees them. They are closed by
        # validateGrantDomainName, by the corpus test
        # TestCapReadWriterRefusal_ShippedProducersStillInstall, and at runtime
        # by NatsKVAdapter's namespace guard. The gate's own vectors therefore
        # run on every invocation — a clean corpus proves nothing on its own.
        # STRICT=1 fails the build on any violation.
        run: STRICT=1 go run ./scripts/lint-cap-read-producers.go

      - name: Refractor single-instance gate (personal derivation licence premise)
        # A personal lens's derivation narrowing rests on the D1 grant-change
        # edge, which is an IN-PROCESS function call: on a second Refractor
        # instance a producer on one announces to no personal lens on another,
        # while every wiring conjunct a consumer could test stays true on both.
        # This fails the moment the repository gains a second-instance
        # affordance — a replica/scale count on a refractor service, two
        # background launches in one Makefile recipe or a loop around one, a new
        # JetStream queue group under cmd/refractor or internal/refractor, or an
        # instance-identity/cardinality env knob — while
        # grantchange.GrantChangeEdgeSpansDeployment is false. The durable
        # grant-change signal is the precondition that retires it.
        #
        # It cannot see orchestration outside this repo (none ships today) or an
        # operator starting the binary twice; the licence's own runtime instance
        # count off Health KV is the other half of the pair. Vectors run on every
        # invocation, since the tree ships no violating configuration.
        # STRICT=1 fails the build on any violation.
        run: STRICT=1 go run ./scripts/lint-refractor-single-instance.go

      - name: Vertical Package Standard gate (S1 descriptors / S6 floor / S7 manifest)
        # A user-facing op with no descriptor is invisible to a
        # descriptor-driven client; a lens no cypher test executes is only
        # proven by an empty read model in production; a manifest that drifts
        # from its Go Definition installs something other than what it claims.
        # Escape hatches are explicit: an `[no-op-meta: ...]` permission Note,
        # or the script's shrink-only debt baseline (a baselined entry that
        # stops violating also fails, so the ledger cannot rot).
        # STRICT=1 fails the build on any violation.
        run: STRICT=1 go run ./scripts/lint-package-standard.go

      - name: Package version-bump gate (packages/ content edits bump the manifest)
        # A packages/ semantic change at an unchanged manifest version is
        # invisible to running stacks — plain install no-ops it. Diffs the
        # pushed range (push: event.before; PR: the base sha); the script
        # fetches the base SHA into the shallow clone itself and soft-skips
        # if it cannot be resolved.
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: go run ./scripts/lint-package-version.go

      - name: Facet discovery-covenant lint (no vertical vocabulary in cmd/facet)
        # The structural guard on Facet's founding covenant: the app hardcodes
        # only login machinery, config, and the descriptor-vocabulary
        # interpreter. Any vertical noun / key type / SQL table / op literal
        # beyond the gate's cited allowlists fails the build — a design doc
        # cannot widen the surface without editing the gate in the same diff.
        run: STRICT=1 go run ./scripts/lint-facet-discovery.go

      - name: Facet renderer-drift lint (descriptor vocabulary parity)
        # FORK-1's freeze trigger is vocabulary completeness across BOTH
        # renderers (edge-showcase-app-design.md FORK-1) — the PWA
        # (app.js's renderField) and the second renderer (FacetManifestKit's
        # DescriptorForm) must detect the same field kinds. This fails the
        # build the moment one renderer gains a kind the other silently
        # falls back to free-text for.
        run: STRICT=1 go run ./scripts/lint-facet-renderer-drift.go

      - name: App op-descriptor lint (vertical apps wire UI only to described ops)
        # The app seam of the Standard's S1: every operationType a cmd/*-app
        # wires UI to must be registered (a package rename/withdrawal breaks
        # CI here, not a person's click at runtime) and described by its
        # owning package — full OpMetaSpec, or a client-side [no-op-meta:]
        # exemption. UI wired to a machinery-exempted op (engine-op/reply-op/
        # lifecycle-op) falsifies that exemption's "no person dispatches
        # this" and fails. The shrink-only appOpDebt baseline holds the ops
        # the apps already reach undescribed — the descriptor sweep's
        # work-list; an entry that stops violating fails too. appOpCeilings
        # ratchets each app's distinct hardcoded-op-literal count to an exact
        # pin: growth above it or an unrecorded shrink below it both fail.
        run: STRICT=1 go run ./scripts/lint-app-op-descriptors.go

      - name: Manifest entityKey/entityType pairing lint (edge-manifest)
        # Every edge-manifest lens tail's `"<literal>" AS entityType` must
        # equal the label its `<var>.key AS entityKey` variable is bound to in
        # the lens's own Walk Chain, and must never name a type any package
        # declares `Abstract: true` — cmd/facet's op-attach + payload-resolve
        # compare entityType to entityKey's own vertex-type segment with
        # `===`, silently, so a drifted literal breaks that entity kind alone.
        run: STRICT=1 go run ./scripts/lint-manifest-entity-type.go

      - name: Orphaned doc-comment lint (a doc comment names what it sits above)
        # A Go doc comment sits directly above its declaration with NO blank
        # line, so a cut taken at the declaration line leaves the comment
        # behind — welded onto the next declaration's own doc block. The moved
        # declaration goes undocumented and its former neighbour is
        # misdocumented, invisibly to the compiler, gofmt, vet, golangci-lint
        # and every test. Minted twice (pipeline.go Inc 2's `writeResults`,
        # executor.go's `propertyOf`), so it is mechanized rather than trusted.
        run: STRICT=1 go run ./scripts/lint-doc-orphan.go

      - name: Capability-KV single-read-path lint (one reader owns Contract #6 §6.1)
        # A non-test Go file outside internal/capabilitykv that either (1) calls
        # KVGet/KVGetMulti/KVListKeys with the capability bucket as its own
        # argument, or (2) concatenates/interpolates one of the four
        # "cap."/"cap.roles." key prefixes Contract #6 §6.1 owns, has
        # re-implemented the routing + doc merge internal/capabilitykv exists to
        # own — check (2) also catches a hand-rolled key handed to the sanctioned
        # helper, which check (1) cannot see. Three allowlisted exceptions
        # (cmd/lattice/query's operator inspection, internal/refractor/pipeline/
        # evaluate.go's producer-side key derivation, scripts/'s build-ignore
        # seed/verify tooling) are named in the gate with a stated reason.
        run: STRICT=1 go run ./scripts/lint-capability-kv-readers.go

      - name: Weaver gap-column declaration lint (projected missing_* ⊆ declared gaps)
        # A `missing_*` column that lands in a weaver target's rows but which the
        # target's gaps map does not declare is held by dispatchGap on the
        # 5-minute long redelivery floor indefinitely: the row occupies a
        # MaxAckPending slot and re-runs the whole clearClosedMarks preamble
        # every floor, forever. The engine cannot tell that authoring omission
        # from a column a package projects deliberately with no remediation, so
        # the deliberate case is made declarable (a `surface` gap, which raises a
        # standing Health issue and Acks) and this gate asserts the invariant.
        # The row body is the UNION of the feeding lens's Output.BodyColumns and
        # Output.StaticEmptyColumns (Refractor's driver writes both), and the
        # feeding lenses are every weaver-targets lens in the package whose
        # OutputKeyPattern prefix equals the targetId — a targetId IS the row
        # prefix, and lane-1 dispatch watches the bucket, not LensRef. Read from
        # the compiled pkgregistry Definitions. One exemption: a target
        # escalating `unplannable` to the Augur tier. Self-tests on every run and
        # refuses an all-clear over zero examined columns.
        run: STRICT=1 go run ./scripts/lint-gap-column-declaration.go

      - name: Weaver witnessed-retire lint (a `surface` membership leaves only on a READ column)
        # internal/weaver has two column readers with two verdicts: boolColumnRead
        # reports the value AND whether the row stated it, while boolColumn
        # discards the second half and reads a PRESENT non-bool as a plain false.
        # The `surface` gap's open-row set counts a target's open WORKLOAD, so
        # shrinking it claims a row's work is DONE — a claim a conservative false
        # cannot support: the count would fall by one per broken row and climb
        # back on the next clean projection, flapping the number an operator
        # reads. This gate parses internal/weaver with go/ast and fails any
        # function that retires a membership (retireSurfaceMembership, or
        # surface.removeEntity) while reading the column that retirement turns on
        # through boolColumn — including a column argument it cannot resolve,
        # which is never a clean pass. Self-tests on every run and refuses an
        # all-clear over zero retiring functions.
        run: STRICT=1 go run ./scripts/lint-weaver-witnessed-retire.go

      - name: Weaver classify-by-shape gate (a reclaim's class is its resolved dispatch)
        # collapseOnlyReclaim decides pacing, `__effect` booking and the retry
        # budget's attempt/reclaim split from a dispatch class. A planned-mode
        # mark records the leg's catalog ref, a goal gap's playbook entry has
        # an empty Action, an escalation records `directOp` — feeding any of
        # those reads a confident "not collapse-only" and spends a human task's
        # budget in minutes. Twice-seen; this gate fails any call whose first
        # argument is not a resolved-action identifier. Self-tests on every run
        # and refuses an all-clear over zero calls.
        run: STRICT=1 go run ./scripts/lint-weaver-classify-by-shape.go

      - name: Flag consumer census (a flag's new reader re-reads its bound)
        # A process-wide flag's comment prices being briefly wrong FOR THE
        # CONSUMER it was written for, and every later reader inherits both the
        # flag and that price without re-reading it. Refractor's rebuild
        # in-flight flag is the worked example: priced "bounded, the sweep is a
        # healer and the attestation reads `drained`", which holds for its first
        # three readers and does not hold for a personal lens, which publishes
        # NOTHING while it is set — there the same brief wrongness is a resumed
        # flood of messages every device drops. Twice-seen. This gate holds a ledger of each registered flag's
        # readers (file + function, parsed with go/ast) and fails both an
        # UNDECLARED reader and a declared one that has stopped reading — the
        # second so the ledger cannot rot into a gate inspecting nothing. Tests
        # are out of scope by design: a test pins the mechanism rather than
        # inheriting its bound.
        run: STRICT=1 go run ./scripts/lint-flag-consumer-census.go

      - name: Board lint (the backlog is an index, not a journal)
        # Backstop on code commits (board-only commits hit board-lint.yml,
        # which the main paths-ignore skips): fails on an over-budget row, a
        # Survey-log/PO-notes fire-journal, or a multi-line Done-log entry.
        run: STRICT=1 go run ./scripts/lint-board.go

      - name: slog attribute-value lint (JSON-handler renders a Stringer-only struct as {})
        # Production installs slog.NewJSONHandler, whose Any arm goes through
        # encoding/json — which honours json.Marshaler / encoding.TextMarshaler
        # but never fmt.Stringer. An slog attribute value whose static type is
        # an in-module named struct (directly, behind one pointer, or as a
        # slice/array/map element) implementing none of slog.LogValuer /
        # json.Marshaler / encoding.TextMarshaler ships as "{}" while a
        # TextHandler-backed unit test reads it fine. Walks package-level
        # slog.* calls, *slog.Logger methods, slog.Any, and the
        # `f(msg, attrs...)` spread shape built from a local []any via
        # append(). `// slog-value: <reason>` on the call's or the value's own
        # line declares a deliberate exception. Self-tests on every invocation.
        run: STRICT=1 go run ./scripts/lint-slog-values.go

  stack-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Bring up Docker stack + run primordial bootstrap
        run: make up

      - name: Verify kernel (~33 assertions, post-Story-4.7)
        run: make verify-kernel

      - name: Install + verify rbac-domain package
        run: make verify-package-rbac

      - name: Install + verify identity-domain package
        run: make verify-package-identity

      - name: Install + verify identity-hygiene package
        run: make verify-package-identity-hygiene

      - name: Install + verify privacy-base package (co-installs rbac/identity)
        run: make verify-package-privacy-base

      - name: Install + verify objects-base package
        run: make verify-package-objects-base

      - name: Install + verify clinic-domain package
        run: make verify-package-clinic-domain

      - name: Install + verify clinic-reminders package (co-installs orchestration-base + clinic-domain)
        run: make verify-package-clinic-reminders

      - name: Install + verify location-domain package
        run: make verify-package-location-domain

      - name: Install + verify loftspace-domain package (co-installs location-domain)
        run: make verify-package-loftspace-domain

      - name: Install + verify service-location package (co-installs location-domain)
        run: make verify-package-service-location

      - name: Install + verify augur package (co-installs orchestration-base)
        run: make verify-package-augur

      - name: Install + verify lease-signing package (co-installs rbac/identity/orchestration-base/service-domain)
        run: make verify-package-lease-signing

      - name: Run Hello Lattice integration suite (Phase 1 Gate 5)
        # Runs the six-milestone Hello Lattice vertical slice:
        # DDL definition, book creation, Lens projection, Postgres query,
        # AI agent cold-start traversal, and DDL rollback. Writes the gate5
        # Health KV marker.
        run: make test-hello-lattice
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Reconcile live permission vertices and grant edges against installed manifests
        # Cross-package, so it runs after every per-package verify — but no
        # per-package verify can see an extra belonging to a package it does
        # not check, or an unattributed one (each does assert its own
        # package's extras, e.g. verify-package-rbac.go). Runs after Hello
        # Lattice too: internal/hellolattice mints permissions via
        # CreatePermission (origin: runtime, a notice here) and never
        # tombstones one or uninstalls a package, so this position covers
        # strictly more committed state at no added false-positive risk, and
        # exercises the runtime-notice path in CI itself. Reconciles both the
        # vtx.permission.* vertices and the lnk.permission.*.grantedBy.role.*
        # edges that actually confer them, plus a registry-anchor pass on each
        # plane against the compiled Go Definition. Fails on a package-origin
        # permission/edge no manifest declares, a body whose key it does not
        # derive, an edge granting a permission its declaring package does not
        # itself declare, a declared key with nothing live at it, an absent
        # primordial permission or kernel grant edge, or a
        # vtx.permission.*/lnk.permission.*.grantedBy.role.* root this pass
        # could not even read.
        run: make verify-permission-provenance

      - name: Run Health KV completeness gate (Phase 1 Gate 5)
        # Connects to the live NATS + running Processor/Refractor and asserts
        # every non-event-driven Health KV key documented in
        # docs/observability/health-kv-schema.md appears within 30s.
        run: make test-health-completeness

      - name: Tear down
        if: always()
        run: make down

  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run lease-convergence suite (Story 14.5 — external-I/O idempotency + convergence)
        # Boots Processor + Refractor + Loom + Weaver + the live bridge in-process
        # (embedded NATS, no extra Docker), installs the real package chain, and
        # drives a lease application to steady-state convergence through the live
        # bridge: drain-then-assert (AC #1), FR58 at-most-once end-to-end (AC #2),
        # D5 gate-asserted (AC #3), and the eager bgcheck-freshness @at lapse.
        # Compiled -tags leaseshortwindow so the freshness window is watchable.
        run: make test-lease-convergence

      - name: Run object-GC convergence e2e (Loop A+B)
        # Boots Processor + outbox + Refractor + Weaver + the object-store-manager
        # in-process; attach → detach → proves the objectLiveness lens →
        # directOp(TombstoneObject) → object.tombstoned → byte-reclaim chain.
        run: make test-object-gc

      - name: Run Augur convergence e2e (L3 escalation)
        # Boots Processor + outbox + Weaver + the live bridge (deterministic
        # FakeAugur, no real model call) in-process; drives an unplannable gap
        # through Weaver escalate → directOp(CreateAugurReasoningClaim) →
        # external.augur → bridge → RecordProposal. Proves a benign proposal lands
        # pending (billed once) AND a scope-escaping proposal is stored invalid
        # (the §5 validator DEFENDED assertion for the AI surface).
        run: make test-augur-convergence

      - name: Run unrouted-convergence gate (FR28/FR29 unroutedTasks Weaver target)
        # Boots Processor + Weaver in-process; installs rbac → identity →
        # orchestration-base via the real InstallPackage path and proves the
        # `surface` action round-trips: a violating row raises a named Health-KV
        # issue with no remediation dispatched, and the issue clears on close.
        run: make test-unrouted-convergence

      - name: Run crypto-shred gate (Vault crypto-shredding e2e)
        # Boots the real Processor commit path (Vault encrypt-on-write /
        # decrypt-on-read) plus a Refractor lens + the KeyShredded nullification
        # listener; drives CreateUnclaimedIdentity → ShredIdentityKey and proves
        # both the async privacy-worker and the Refractor listener handle it.
        run: make test-crypto-shred

      - name: Run system-actor-capability gate (Fire 2)
        # Boots the real Processor under LATTICE_AUTH_MODE=capability + the real
        # Refractor; submits the four system-actor-submitted engine ops (Weaver
        # MarkExpired, Loom CreateTask, object-store-manager DetachObject,
        # RecordShredFinalization) as the real kernel-seeded actors and proves
        # each authorizes.
        run: make test-system-actor-capability

      - name: Run control-plane-authz gate (FR30 Fire 1b Gate-3)
        # Boots the real Processor under LATTICE_AUTH_MODE=capability + the real
        # Refractor; drives a real weaver control.Service round-trip over NATS:
        # operator disable succeeds, intruder disable denied, anonymous disable
        # denied.
        run: make test-control-plane-authz

  # Shard package globs (also referenced verbatim by unit-shard-coverage below —
  # keep the four in sync; the coverage job fails CI if they ever drift). Two
  # packages are deliberately absent from all four globs and run as their own
  # jobs instead: internal/natsperm (unit-natsperm, for its own -parallel
  # setting — see there) and internal/refractor (unit-refractor, the package
  # that made unit-1 the shard pole — see the jobs comment above); the
  # coverage job lists both so the union still accounts for every package.
  # unit-2/3/4 carry their own Postgres service (not the docker-compose stack)
  # so whichever shard an RLS integration test (skipIfNoPostgres) lands in —
  # today that's cmd/loftspace-app, internal/gateway, packages/clinic-reminders
  # (internal/refractor's own Postgres-gated tests moved with it to
  # unit-refractor) — it runs instead of silently skipping; they used to run
  # under the now-retired Gate 3 stack-gates step, the only place
  # POSTGRES_TEST_DSN was previously set. unit-1 carries no Postgres service:
  # none of its remaining glob has a Postgres-gated test. Weight-balanced by
  # MEASURED `go test -json` per-package elapsed time, not LOC — LOC tracks
  # package size, not the I/O-bound wall-clock cost that actually determines
  # the job's runtime, so a prior LOC-balanced 3-way split still left one
  # shard as the pole. See the jobs comment above for the re-derive command;
  # never rebalance from memory.
  unit-1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run shard-1 tests (unit + integration)
        # -p 4: up to four test packages run concurrently. Every embedded
        # NATS+JetStream fixture binds a random port and owns a private
        # StoreDir under jsstore.Dir(t), so concurrent packages share no
        # JetStream file state. No Postgres service here: none of this glob's
        # packages carry a POSTGRES_TEST_DSN-gated test (internal/refractor,
        # the one package here that did, is now unit-refractor's alone —
        # see the jobs comment above).
        run: >-
          go test -count=1 -p 4 -timeout 10m
          ./cmd/gateway/... ./cmd/loupe/... ./cmd/wellness-app/...
          ./internal/chronicler/...
          ./internal/identityceremony/...
          ./internal/pkgregistry/...
          ./internal/testutil/... ./internal/weaver/...
          ./packages/console-operator/... ./packages/front-desk/...
          ./packages/privacy-operator-grant/...
          ./packages/rbac-domain/...
          ./packages/wellness-reminders/...

  unit-refractor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice_dev
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run internal/refractor tests (the package that made unit-1 the pole)
        # Split off unit-1 (see the jobs comment above): this package alone
        # measured ~150s of unit-1's ~200-210s, well above unit-2/3/4's
        # ~130-150s. Its own Postgres-gated test (structural_pause_recovery_
        # e2e_test.go) plus the adapter/pipeline/ruleengine/full subtrees'
        # RLS + audit integration tests need the service container above.
        # -skip TestRefractor_E2E_P99: that test asserts an absolute wall-clock
        # latency budget (NFR-P3, 500ms); run inside this -p 4 batch it shares
        # the runner's CPU with its own subpackages and the measurement reads
        # contention, not regression — CI run 31288862556 timed out
        # mid-assertion when the NATS connection it was measuring against got
        # starved and closed. It runs alone in the step below.
        env:
          POSTGRES_TEST_DSN: postgres://lattice:lattice_dev@localhost:5432/lattice?sslmode=disable
        run: >-
          go test -count=1 -p 4 -timeout 10m -skip '^TestRefractor_E2E_P99$'
          ./internal/refractor/...

      - name: Run Refractor E2E p99 latency gate alone (NFR-P3, isolated from -p4 contention)
        # Job steps run sequentially, so this has the runner to itself: the
        # 500ms p99 budget above measures real projection latency instead of
        # whatever else -p 4 happened to be scheduling that run.
        run: go test -count=1 -timeout 2m -run '^TestRefractor_E2E_P99$' ./internal/refractor/...

  unit-2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice_dev
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run shard-2 tests (unit + integration)
        env:
          POSTGRES_TEST_DSN: postgres://lattice:lattice_dev@localhost:5432/lattice?sslmode=disable
        run: >-
          go test -count=1 -p 4 -timeout 10m
          ./cmd/loftspace-app/... ./internal/bridge/... ./internal/controlauth/...
          ./internal/objectcrypto/... ./internal/privacyworker/...
          ./internal/processor/... ./packages/cafe-ledger/...
          ./packages/capability-author/... ./packages/demo-operator/...
          ./packages/edge-manifest/... ./packages/lease-signing/...
          ./packages/loftspace-ledger/... ./packages/objects-base/...
          ./packages/one-bill/... ./packages/service-location/...
          ./packages/wellness-domain/...

  unit-3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lattice
          POSTGRES_PASSWORD: lattice_dev
          POSTGRES_DB: lattice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lattice -d lattice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
